server:
  port: 8080

spring:
  application:
    name: servico-gateway
  cloud:
    gateway:
      routes:
        - id: servico-autenticacao
          uri: ${URL_SERVICO_AUTENTICACAO:http://localhost:8081}
          predicates:
            - Path=/api/autenticacao/**
        - id: servico-catalogo
          uri: ${URL_SERVICO_CATALOGO:http://localhost:8082}
          predicates:
            - Path=/api/catalogo/**
        - id: servico-reserva
          uri: ${URL_SERVICO_RESERVA:http://localhost:8083}
          predicates:
            - Path=/api/reservas/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
