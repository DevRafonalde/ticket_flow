services:

  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow123}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: ticketflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  servico-gateway:
    build: ./servico-gateway
    container_name: ticketflow-gateway
    ports:
      - "8080:8080"
    environment:
      URL_SERVICO_AUTENTICACAO: http://servico-autenticacao:8081
      URL_SERVICO_CATALOGO: http://servico-catalogo:8082
      URL_SERVICO_RESERVA: http://servico-reserva:8083
    depends_on:
      servico-autenticacao:
        condition: service_started
      servico-catalogo:
        condition: service_started
      servico-reserva:
        condition: service_started

  servico-autenticacao:
    build: ./servico-autenticacao
    container_name: ticketflow-autenticacao
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketflow}?currentSchema=autenticacao
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticketflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-a-real-env-file}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy

  servico-catalogo:
    build: ./servico-catalogo
    container_name: ticketflow-catalogo
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketflow}?currentSchema=catalogo
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticketflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow123}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  servico-reserva:
    build: ./servico-reserva
    container_name: ticketflow-reserva
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketflow}?currentSchema=reserva
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticketflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BOOKING_RESERVATION_TIMEOUT_MINUTES: ${BOOKING_RESERVATION_TIMEOUT_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  servico-notificacao:
    build: ./servico-notificacao
    container_name: ticketflow-notificacao
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
