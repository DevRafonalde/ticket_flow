server:
  port: 8082

spring:
  application:
    name: servico-catalogo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketflow?currentSchema=catalogo}
    username: ${SPRING_DATASOURCE_USERNAME:ticketflow}
    password: ${SPRING_DATASOURCE_PASSWORD:ticketflow123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalogo
  flyway:
    schemas: catalogo
    default-schema: catalogo
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  # Mesmo segredo usado pelo servico-autenticacao para assinar o token (ver .env.example) -
  # é o que permite validar o JWT aqui sem chamar aquele serviço a cada requisição.
  secret: ${JWT_SECRET:change-me-in-a-real-env-file}

internal:
  # Segredo servico-a-servico (não é JWT de usuário) - exigido em endpoints chamados só por
  # outros backends, como a reserva de assentos usada pelo servico-reserva.
  api-key: ${INTERNAL_API_KEY:change-me-in-a-real-env-file}
